<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 32 32">
  <!--
    Tennis-ball map cursor (components/site/v3/V3Atlas.css, .v3-atlas__stage).
    Matt 2026-09-23: an explicit, one-off off-brand color for this one playful
    element ("make the mouse a bright tennis ball"). The optic yellow-green is
    NOT a design-system token and must never be used outside this asset file —
    scripts/lint-design-tokens.js does not scan .svg files (FILE_EXTENSIONS is
    ts/tsx/js/jsx only), so the exception lives here, contained, rather than
    as a token or a lint allowlist entry. Do not copy this color into any
    .css/.tsx file.
    Matt 2026-09-24: "tennis ball needs to be smaller". Drawn at 20px (was
    32); the same 32-unit drawing, so the hotspot in V3Atlas.css is 10 10.
  -->
  <circle cx="16" cy="16" r="14.5" fill="#D7F205" stroke="#5c6b1a" stroke-width="1.1" />
  <path
    d="M 5 7 C 10 11, 10 21, 5 25"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.1"
    stroke-linecap="round"
  />
  <path
    d="M 27 7 C 22 11, 22 21, 27 25"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.1"
    stroke-linecap="round"
  />
</svg>
