<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Decision sheet — contact</title>
  <style>
    :root { color-scheme: light; --navy: #102742; --cream: #faf8f4; }
    body { margin: 0; padding: 2rem; background: var(--cream); color: var(--navy);
      font: 15px/1.45 Geist, ui-sans-serif, system-ui, sans-serif; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.5rem; }
    .q { max-width: 44rem; margin: 0 0 2rem; }
    .variant { margin: 0 0 2.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(16,39,66,0.15); }
    .variant h2 { font-size: 1.1rem; margin: 0 0 1rem; letter-spacing: 0.02em; }
    .pair { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; }
    figure { margin: 0; }
    figure img { display: block; max-width: 100%; height: auto; border: 1px solid rgba(16,39,66,0.12); background: #fff; }
    figcaption { font-size: 0.75rem; margin-top: 0.35rem; opacity: 0.7; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Decision sheet — <code>contact</code></h1>
  <p class="q">Which contact fold wins — quiet-doors, call-figure, or faces-first? Reply with the exact name; losers are deleted in the pick commit.</p>
  <section class="variant">
  <h2>quiet-doors</h2>
  <div class="pair">
    <figure>
      <img src="contact/variants/quiet-doors-desktop.png" alt="quiet-doors at 1440" width="1440" height="900" />
      <figcaption>1440</figcaption>
    </figure>
    <figure>
      <img src="contact/variants/quiet-doors-mobile375.png" alt="quiet-doors at 375" width="375" height="812" />
      <figcaption>375</figcaption>
    </figure>
  </div>
</section>
<section class="variant">
  <h2>call-figure</h2>
  <div class="pair">
    <figure>
      <img src="contact/variants/call-figure-desktop.png" alt="call-figure at 1440" width="1440" height="900" />
      <figcaption>1440</figcaption>
    </figure>
    <figure>
      <img src="contact/variants/call-figure-mobile375.png" alt="call-figure at 375" width="375" height="812" />
      <figcaption>375</figcaption>
    </figure>
  </div>
</section>
<section class="variant">
  <h2>faces-first</h2>
  <div class="pair">
    <figure>
      <img src="contact/variants/faces-first-desktop.png" alt="faces-first at 1440" width="1440" height="900" />
      <figcaption>1440</figcaption>
    </figure>
    <figure>
      <img src="contact/variants/faces-first-mobile375.png" alt="faces-first at 375" width="375" height="812" />
      <figcaption>375</figcaption>
    </figure>
  </div>
</section>
</body>
</html>
