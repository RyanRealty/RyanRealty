name: content-queue-publish
# Publishes approved social drafts from content-queue/ on their scheduled_at date (PT).
# DRY RUN unless the repo variable CONTENT_QUEUE_LIVE is "true". Even live, a draft posts
# only with `approved: true` (Matt's say-so), a green gate, and the platform's credentials.
# Runs on merge to main (dry-run report of what is queued) and daily at 9:00 AM PT.
on:
  push:
    branches: [main]
    paths: ['content-queue/**', 'scripts/content-queue/**']
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'PT date to publish (YYYY-MM-DD). Blank = today.'
        required: false
concurrency:
  group: content-queue-publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gate
        run: node scripts/content-queue/check.mjs
      - name: Publish (dry run unless CONTENT_QUEUE_LIVE=true)
        env:
          CONTENT_QUEUE_LIVE: ${{ github.event_name == 'schedule' && vars.CONTENT_QUEUE_LIVE || 'false' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_BUSINESS_PROFILE_ACCOUNT_ID: ${{ secrets.GOOGLE_BUSINESS_PROFILE_ACCOUNT_ID }}
          GOOGLE_BUSINESS_PROFILE_LOCATION_ID: ${{ secrets.GOOGLE_BUSINESS_PROFILE_LOCATION_ID }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/content-queue/publish.mjs --all
          else
            node scripts/content-queue/publish.mjs --live ${{ inputs.date && format('--date={0}', inputs.date) || '' }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-queue-report
          path: .content-queue-out/
          if-no-files-found: ignore
