name: PR auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled, unlabeled, synchronize]
  workflow_run:
    workflows: [CI, Security Scan]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to queue (empty = labels + title holds only)
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  auto-merge:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve PR number
        id: pr
        env:
          EVENT_PR: ${{ github.event.pull_request.number }}
          WORKFLOW_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          if [ -n "$EVENT_PR" ]; then
            echo "number=$EVENT_PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$INPUT_PR" ]; then
            echo "number=$INPUT_PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(echo "$WORKFLOW_PRS" | jq -r '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Ensure labels and apply title holds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-auto-merge.mjs --ensure-labels --apply-title-holds
      - name: Disable auto-merge when hold-for-matt is added without approval
        if: >
          github.event.action == 'labeled' &&
          github.event.label.name == 'hold-for-matt' &&
          !contains(join(github.event.pull_request.labels.*.name, ','), 'approved-by-matt')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --disable-auto || true
      - name: Queue auto-merge
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-auto-merge.mjs --pr "${{ steps.pr.outputs.number }}"
