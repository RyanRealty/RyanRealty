name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PARALLEL LAYOUT (2026-10-09, Matt: "we cannot have GitHub taking 45 minutes
# per PR"). PR #447's run took 45.7 minutes because one job ran every gate in a
# row (lint 2.8, ci:gates 2.1, test:unit 6.1, build 4.8, route smoke + runtime
# gates 6.2, pa11y 0.8, Lighthouse 9.5) and only THEN started e2e, which built
# the app a second time (7.5) before its 2.3 minutes of tests. Queueing was
# ~0: the time was all serial work.
#
# Same gates, same commands, same thresholds, now side by side:
#   lint · gates (ci:gates + type check) ·        start at once, no build needed
#     test:unit (3 shards)
#   build                                         one production build, packed
#   smoke · content-floor (4) · a11y ·            start with the build (checkout,
#     lighthouse (4) · e2e                        npm ci, browsers), then unpack
#                                                 it and start a fresh server
#   lint-and-build                                fails if ANY job above failed
#
# Shards split the work, never the bar: vitest --shard runs every test file
# exactly once across the shards; LHCI_SHARD and CONTENT_FLOOR_SHARD split the
# URL and class lists (see lighthouserc.cjs and check-route-content-floor.mjs).
#
# `lint-and-build` keeps its name so anything that watches that check still
# works; it is now the roll-up of every job, e2e included.

# Default token scope. `build` widens it for the bundle-size PR comment.
permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SKYSLOPE_ACCESS_KEY: ${{ secrets.SKYSLOPE_ACCESS_KEY }}
  SKYSLOPE_ACCESS_SECRET: ${{ secrets.SKYSLOPE_ACCESS_SECRET }}
  SKYSLOPE_CLIENT_ID: ${{ secrets.SKYSLOPE_CLIENT_ID }}
  SKYSLOPE_CLIENT_SECRET: ${{ secrets.SKYSLOPE_CLIENT_SECRET }}
  # lib/env.ts requiredForRuntime enforces SPARK_API_KEY at server BOOT
  # (instrumentation register()) — without it `next start` dies with
  # "Failed to prepare server" and Playwright's webServer times out (the
  # CI e2e job's 2026-07-17 failure). The critical-flow specs read
  # Supabase, never Spark, so a dummy satisfies the boot check when the
  # secret is unset.
  SPARK_API_KEY: ${{ secrets.SPARK_API_KEY || 'ci-e2e-dummy-not-a-real-key' }}

jobs:
  # Docs-only pull requests (every changed file under docs/, e.g. the CMA
  # handoff note) cannot change the built app: no app, lib or component code
  # reads docs/. They still get lint, ci:gates and test:unit; the build and
  # the server-side jobs are skipped. Anything outside docs/ runs everything.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.files.outputs.app }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename' > /tmp/changed.txt
          total=$(wc -l < /tmp/changed.txt)
          outside=$(grep -cv '^docs/' /tmp/changed.txt || true)
          echo "changed files: $total, outside docs/: $outside"
          # The files API stops at 3000; treat a huge or empty list as app code.
          if [ "$total" -gt 0 ] && [ "$total" -lt 3000 ] && [ "$outside" -eq 0 ]; then
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: ci:gates picks its path lane from
      # GITHUB_EVENT_BEFORE...GITHUB_SHA (see scripts/lib/ci-gates-select.mjs).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Path-aware `ci:gates` (always ∪ matching path). Nightly/cert lanes
      # run in quality.yml (`--lane=nightly`), not here.
      # See docs/MECHANICAL_GATES.md.
      - run: npm run ci:gates
      # The type check `next build` used to run inside the build job ("Running
      # TypeScript", 2.2 minutes on the critical path). Same program: tsconfig
      # includes .next/types, which `next typegen` writes without a build.
      - name: Type check (the check next build ran)
        env:
          NODE_OPTIONS: --max-old-space-size=10240
        run: |
          npx next typegen
          npx tsc --noEmit -p tsconfig.json

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # R-221: PR/main CI is unit+gates only. Live-DB int tests run nightly
      # (int-nightly.yml). Sitting on a 8-minute int suite is how agents burn money.
      # --shard: each of the 3 jobs runs a third of the test files; together
      # they run every file of both projects (unit, gates) exactly once.
      - run: npm run test:unit -- --shard=${{ matrix.shard }}/3

  build:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # "Report bundle sizes" posts a PR comment via actions/github-script, which
    # needs pull-requests: write (naming a permissions block drops the rest,
    # so contents: read for actions/checkout is explicit).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Push to main: Vercel owns generate, so the build runs on pull_request
      # only (this job's `if`).
      - run: npm run build
        env:
          # 10240, not 6144 (2026-09-30): Next's "Running TypeScript" phase
          # outgrew 6144 on PR #401 (V8 heap limit, SIGABRT). package.json's
          # build script appends this value after its 6144 default, and the
          # later flag wins.
          NODE_OPTIONS: --max-old-space-size=10240
          # The type check runs in the gates job instead (same tsconfig, same
          # tsc, in parallel). next.config.ts reads this; nothing else sets it.
          RR_CI_TYPECHECK_SEPARATE: '1'

      # Pack the build for the runtime-gate jobs: all of .next except the
      # compiler caches (the data cache under .next/cache stays, so the server
      # those jobs start is the one this build made), plus every untracked
      # file the build wrote outside .next (prebuild's public/pdf.worker.min.mjs,
      # the generated service worker). Packed before the budget and the
      # bundle comment so the waiting jobs get it as early as possible.
      - name: Pack build
        run: |
          git ls-files --others --directory \
            | grep -vE '^(node_modules/|\.next/)' > /tmp/build-extra.txt || true
          echo "extra build outputs:"; cat /tmp/build-extra.txt
          tar --exclude='.next/cache/webpack' --exclude='.next/cache/turbopack' --exclude='.next/cache/swc' \
            -I 'zstd -T0 -3' -cf next-build.tar.zst .next -T /tmp/build-extra.txt
          ls -lh next-build.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tar.zst
          compression-level: 0
          retention-days: 1

      # Bundle budget parses .next/static after the build above.
      - run: npm run ci:bundle-budget

      # Bundle size report. continue-on-error because this posts an informational
      # PR comment: if commenting is unavailable (org token policy, a fork PR
      # where the token is read-only regardless of the block above), that is not
      # a reason to fail a build whose every real gate has passed.
      - name: Report bundle sizes
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const appDir = '.next/static';
            let totalSize = 0;
            const chunks = [];

            function walk(dir) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  walk(full);
                } else {
                  const size = fs.statSync(full).size;
                  totalSize += size;
                  if (entry.name.endsWith('.js')) {
                    chunks.push({ name: entry.name, size });
                  }
                }
              }
            }
            walk(appDir);

            chunks.sort((a, b) => b.size - a.size);
            const top5 = chunks.slice(0, 5);
            const fmt = (bytes) => {
              if (bytes > 1024 * 1024) return (bytes / 1024 / 1024).toFixed(2) + ' MB';
              return (bytes / 1024).toFixed(1) + ' KB';
            };

            let report = '## Bundle Size Report\n\n';
            report += `**Total static size:** ${fmt(totalSize)}\n\n`;
            report += '| Chunk | Size |\n|-------|------|\n';
            for (const c of top5) {
              report += `| ${c.name} | ${fmt(c.size)} |\n`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Bundle Size Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report,
              });
            }

  # Route smoke + the rendered-page ratchets that share one server. History of
  # the explicit start / wait / smoke split: start-server-and-test timed out
  # mutely on every PR from 2026-07-25; scripts/wait-for-server.mjs reports
  # each probe and the server log is dumped on failure (.github/actions/use-build).
  smoke:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # use-build polls this run for the build artifact
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # ci:tap-targets drives headless Chromium through Playwright; without
      # the browser every PR failed with "Executable doesn't exist at
      # ~/.cache/ms-playwright/…" (2026-09-05).
      - uses: ./.github/actions/use-build
        with:
          playwright: 'true'
      - name: Route smoke test
        run: |
          # Pick a real listing key (falls back to a known-active one)
          export SMOKE_LISTING_KEY=$(node scripts/pick-lhci-listing.mjs 2>/dev/null | grep -oE '[0-9]{20,}' | head -1)
          npm run ci:route-smoke

          # Rendered-HTML payload ratchet (audit item 16). Measures a real built
          # server. /homes-for-sale drifted 996 KB -> 1,019,774 bytes with
          # nothing watching it.
          npm run ci:page-payload

          # Atlas props budget, served-bytes layer (UXLIVE-3, visibility audit
          # 2026-09-22): 192 KiB of Atlas props per built page, no inline dots.
          # /about carried 3.15 MB of them on 2026-09-23.
          ATLAS_PROPS_BASE_URL=http://127.0.0.1:3000 npm run ci:atlas-props-budget

          # 44x44 tap-target ratchet, measured on the rendered page (WCAG 2.5.8
          # "Equivalent" is a property of the page, not the source). Baselined
          # in scripts/tap-targets-baseline.json; the list may only shrink.
          npm run ci:tap-targets

          # The listing page's first screen on a phone (PR #386, Matt
          # 2026-09-25 "I hate all the wasted space"): address, price and
          # beds / baths / sq ft inside the fold at 375x812 and 390x844.
          npm run ci:listing-phone-fold

  # No-regression floor (Matt 2026-09-12). Every public class keeps the hero
  # width, image resolution, video, sections, words, links and JSON-LD it
  # carried when its contentFloor was seeded on parity.json. Lower a floor only
  # by hand, in the same commit. 27 classes, about 10 s each: split 4 ways.
  content-floor:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # use-build polls this run for the build artifact
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/use-build
        with:
          playwright: 'true'
      - name: Route content floor
        env:
          CONTENT_FLOOR_SHARD: ${{ matrix.shard }}/4
        run: npm run ci:route-content-floor

  # G23 — pa11y-ci, BLOCKING since 2026-08-02 (WCAG 2.1 failures Lighthouse's
  # aggregate a11y score misses). It always wanted a fresh server (it flaked
  # after Lighthouse's 24 passes on 2026-08-21); it now has one to itself.
  a11y:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # use-build polls this run for the build artifact
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/use-build
      - name: pa11y-ci accessibility
        run: npm run ci:a11y

  # Lighthouse CI — BLOCKING since 2026-08-02. lighthouserc.cjs holds the
  # thresholds (a11y/SEO/CLS/best-practices at error, perf/LCP at warn until
  # runner samples validate them; promote there, not here). 8 URLs x 3 runs
  # took 9.5 minutes on one runner, so LHCI_SHARD splits the URLs 4 ways;
  # each URL keeps its 3 runs and its assertions.
  lighthouse:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # use-build polls this run for the build artifact
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/use-build
      - name: Lighthouse CI
        env:
          LHCI_SHARD: ${{ matrix.shard }}/4
        run: npm run ci:lighthouse

  e2e:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # use-build polls this run for the build artifact
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Playwright's webServer starts `npm run start:ci` itself in CI
      # (reuseExistingServer is off there), so no server here.
      - uses: ./.github/actions/use-build
        with:
          start-server: 'false'
          playwright: 'true'

      # Run E2E tests (critical flows only — visual regression needs baselines)
      - name: Run E2E tests
        # gate-tap-targets exercises scripts/check-tap-targets.mjs's in-page
        # collector in a real Chromium; it needs a layout engine, which only
        # this lane installs. It sets its own content and never navigates.
        run: npx playwright test e2e/critical-flows.spec.ts e2e/gate-tap-targets.spec.ts --project=chromium

      # Upload test artifacts on failure
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            e2e/test-results/
            e2e/html-report/
          retention-days: 7

      # Run visual regression (allow failure until baselines are committed)
      - name: Run visual regression tests
        continue-on-error: true
        run: npx playwright test e2e/visual-regression.spec.ts --project=chromium

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: e2e/visual-diffs/
          retention-days: 7

  # The one check to read: green only when every job above passed (or was
  # skipped by design: the build and its server jobs on pushes to main and on
  # docs-only PRs). A failed, cancelled or timed-out job turns it red.
  lint-and-build:
    if: always()
    needs: [changes, lint, gates, unit, build, smoke, content-floor, a11y, lighthouse, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every CI job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          APP: ${{ needs.changes.outputs.app }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')
          if [ -n "$bad" ]; then echo "::error::failed or cancelled: $bad"; exit 1; fi
          # A PR that touches app code must have actually built and served it.
          if [ "$EVENT" = "pull_request" ] && [ "$APP" != "false" ]; then
            missed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(" ")')
            if [ -n "$missed" ]; then echo "::error::skipped on an app PR: $missed"; exit 1; fi
          fi
          echo "All CI jobs passed."
