name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    # "Report bundle sizes" posts a PR comment via actions/github-script. With
    # no permissions block the GITHUB_TOKEN is read-only, so that step died with
    # "HttpError: Resource not accessible by integration". It had never run
    # before — the route smoke above it failed for months, so everything
    # downstream was skipped and the missing grant stayed invisible.
    #
    # contents: read is what actions/checkout needs; naming a permissions block
    # at all drops everything not listed, so both are explicit.
    permissions:
      contents: read
      pull-requests: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SKYSLOPE_ACCESS_KEY: ${{ secrets.SKYSLOPE_ACCESS_KEY }}
      SKYSLOPE_ACCESS_SECRET: ${{ secrets.SKYSLOPE_ACCESS_SECRET }}
      SKYSLOPE_CLIENT_ID: ${{ secrets.SKYSLOPE_CLIENT_ID }}
      SKYSLOPE_CLIENT_SECRET: ${{ secrets.SKYSLOPE_CLIENT_SECRET }}
      # lib/env.ts requiredForRuntime enforces SPARK_API_KEY at server BOOT
      # (instrumentation register()) — without it `next start` dies with
      # "Failed to prepare server" and Playwright's webServer times out (the
      # CI e2e job's 2026-07-17 failure). The critical-flow specs read
      # Supabase, never Spark, so a dummy satisfies the boot check when the
      # secret is unset.
      SPARK_API_KEY: ${{ secrets.SPARK_API_KEY || 'ci-e2e-dummy-not-a-real-key' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      # Canonical gate suite — runs ALL mechanical gates (the same
      # `ci:gates` developers run locally + pre-push), not a hand-picked
      # subset. Adding a gate to package.json's `ci:gates` chain now
      # auto-enforces it here too. Previously CI hand-listed ~13 gates
      # and silently omitted 9 (no-mojibake, producer-skills,
      # tool-discipline, geo-imagery, boundary-map, community-page,
      # community-content, ai-structured-data, design-directives,
      # hook-tests). Wired 2026-05-30 — gate LAUNCH-15 / DATA-15 / SKILL-12.
      # See docs/MECHANICAL_GATES.md.
      - run: npm run ci:gates
      - run: npm run test
      # NODE_OPTIONS: the type-check phase OOMs at Node's default ~4GB heap at
      # this repo's size (SIGABRT mid "Running TypeScript" — same fix as the
      # local push chain). Invisible until 2026-07-17 because the lint step
      # ahead of it failed first from June 24 on.
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # Post-build gates: bundle budget + route smoke. Bundle budget
      # parses .next/static after the build step above. Route smoke
      # starts the production server and hits the canonical route set,
      # asserting no 404/5xx/blank-page regressions per CLAUDE.md
      # "verify before moving on."
      - run: npm run ci:bundle-budget
      # Was `npm run ci:route-smoke:start`, i.e. start-server-and-test. That
      # wrapper has failed on EVERY pull request since at least 2026-07-25
      # (verified on unrelated branches: same step, same 5:02 wait-on timeout),
      # and its entire failure output is "Timed out waiting for:
      # http://127.0.0.1:3000" — no status code, no timing, no server log, so
      # the cause was undiagnosable from CI. Meanwhile a production build of the
      # same commit serves `/` with HTTP 200 in 0.55s locally and passes 277/277
      # routes, so the application is not the cause.
      #
      # Split into explicit start / wait / smoke. Same semantics, but the wait
      # reports what it saw on each probe and the server log is dumped on
      # failure, so a red run now explains itself instead of timing out mutely.
      - name: Route smoke test
        if: github.event_name == 'pull_request'
        run: |
          # Pick a real listing key (falls back to a known-active one)
          export SMOKE_LISTING_KEY=$(node scripts/pick-lhci-listing.mjs 2>/dev/null | grep -oE '[0-9]{20,}' | head -1)
          npm run start:ci > /tmp/route-smoke-server.log 2>&1 &
          if ! node scripts/wait-for-server.mjs http://127.0.0.1:3000 180; then
            echo "----- server log -----"
            cat /tmp/route-smoke-server.log || true
            exit 1
          fi
          npm run ci:route-smoke

          # Rendered-HTML payload ratchet (audit item 16). Runs here rather than
          # in the static ci:gates chain because it measures a real built server,
          # and the server started above is already up. /homes-for-sale drifted
          # 996 KB -> 1,019,774 bytes with nothing watching it.
          npm run ci:page-payload

      # Lighthouse CI — gates PRs on perf/a11y/BP/SEO regression against
      # lighthouserc.cjs thresholds. Uses start-server-and-test under the hood.
      # Skipped on push events (already run nightly via quality.yml).
      # NOTE (2026-08-02): this step and pa11y below have NEVER executed. They
      # called `npm run ci:lighthouse` / `npm run ci:a11y`, and neither script
      # existed in package.json — every run died instantly on "Missing script".
      # Nobody noticed because the route smoke above failed first for months, so
      # both were permanently skipped. Same shape as the punctuation rule: a
      # gate that was documented, believed enforced, and checked by nothing.
      #
      # The scripts are now defined (the tooling and configs were always here:
      # @lhci/cli + lighthouserc.cjs, pa11y-ci + .pa11yci.json), so these run
      # for the first time.
      #
      # The first real output HAS now been read (2026-08-02 calibration: 40+
      # Lighthouse passes, pa11y root-caused from 0/8 to a verified 8/8), which
      # is what the original continue-on-error was waiting for.
      #
      # Both need a server on 127.0.0.1:3000 and lighthouserc.cjs sets no
      # startServerCommand, so the smoke step above deliberately leaves its
      # server running. Teardown is the runner's job — see the note below.
      # BLOCKING as of 2026-08-02 (Matt approved the flip). The config runs
      # accessibility/SEO/CLS/best-practices at error level — measured margin,
      # not timing-sensitive — while performance/LCP assert at "warn" (printed,
      # never fatal) until 2-3 real runner samples validate the estimated CI
      # hardware headroom in lighthouserc.cjs. Promote perf/LCP there, not here.
      - name: Lighthouse CI
        if: github.event_name == 'pull_request'
        run: npm run ci:lighthouse

      # G23 — pa11y-ci. The Lighthouse a11y category covers aggregate
      # scoring but misses specific WCAG 2.1 failures that show up at
      # component-level (missing alt text, unlabeled inputs, contrast
      # failures on specific elements). pa11y-ci catches those.
      # Closes GAP-3 from out/guardrail-inventory-2026-05-28.md.
      # BLOCKING as of 2026-08-02. Its first real execution reported 0/8 URLs
      # passing and the failure rendered as a green check for a day because of
      # continue-on-error. The causes are fixed (contrast scrim, map-marker
      # titles, third-party iframes scoped out, stale alias URL) and a real
      # production build measures 8/8 with 0 errors — WCAG rule evaluation is
      # not CPU-timing-sensitive, so CI hardware cannot flake it the way perf
      # numbers can.
      - name: pa11y-ci accessibility
        if: github.event_name == 'pull_request'
        run: npm run ci:a11y

      # NO explicit teardown step for the smoke server, deliberately.
      #
      # A "Stop smoke server" step here killed the process GROUP, reasoning that
      # `npm run start:ci` spawns next-server as a child so killing the npm pid
      # alone leaves the child holding port 3000. That took down the RUNNER:
      # background jobs started from a step inherit the runner's process group,
      # so the negative-pid kill signalled the runner too. The job died with
      # exit 143 and "The runner has received a shutdown signal" after every
      # other step had already passed.
      #
      # The runner cleans up after itself regardless — "Terminate orphan
      # process: next-server" at the end of the job is that working as intended.
      # The server needs to outlive the smoke step anyway so Lighthouse and
      # pa11y can reach it, and nothing after them needs port 3000.

      # Build health tracking
      - name: Record build health metrics
        if: always()
        run: |
          npx tsx scripts/track-build-health.ts 2>/dev/null || true


      # Bundle size report. continue-on-error because this posts an informational
      # PR comment: if commenting is unavailable (org token policy, a fork PR
      # where the token is read-only regardless of the block above), that is not
      # a reason to fail a build whose every real gate has passed.
      - name: Report bundle sizes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const appDir = '.next/static';
            let totalSize = 0;
            const chunks = [];

            function walk(dir) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  walk(full);
                } else {
                  const size = fs.statSync(full).size;
                  totalSize += size;
                  if (entry.name.endsWith('.js')) {
                    chunks.push({ name: entry.name, size });
                  }
                }
              }
            }
            walk(appDir);

            chunks.sort((a, b) => b.size - a.size);
            const top5 = chunks.slice(0, 5);
            const fmt = (bytes) => {
              if (bytes > 1024 * 1024) return (bytes / 1024 / 1024).toFixed(2) + ' MB';
              return (bytes / 1024).toFixed(1) + ' KB';
            };

            let report = '## Bundle Size Report\n\n';
            report += `**Total static size:** ${fmt(totalSize)}\n\n`;
            report += '| Chunk | Size |\n|-------|------|\n';
            for (const c of top5) {
              report += `| ${c.name} | ${fmt(c.size)} |\n`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Bundle Size Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report,
              });
            }

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-build
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SKYSLOPE_ACCESS_KEY: ${{ secrets.SKYSLOPE_ACCESS_KEY }}
      SKYSLOPE_ACCESS_SECRET: ${{ secrets.SKYSLOPE_ACCESS_SECRET }}
      SKYSLOPE_CLIENT_ID: ${{ secrets.SKYSLOPE_CLIENT_ID }}
      SKYSLOPE_CLIENT_SECRET: ${{ secrets.SKYSLOPE_CLIENT_SECRET }}
      # lib/env.ts requiredForRuntime enforces SPARK_API_KEY at server BOOT
      # (instrumentation register()) — without it `next start` dies with
      # "Failed to prepare server" and Playwright's webServer times out (the
      # CI e2e job's 2026-07-17 failure). The critical-flow specs read
      # Supabase, never Spark, so a dummy satisfies the boot check when the
      # secret is unset.
      SPARK_API_KEY: ${{ secrets.SPARK_API_KEY || 'ci-e2e-dummy-not-a-real-key' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Build the Next.js app (self-contained, no artifact transfer).
      # NODE_OPTIONS: same heap fix as lint-and-build — the type-check phase
      # OOMs at Node's default ~4GB at this repo's size.
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # Install only chromium for speed
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Run E2E tests (critical flows only — visual regression needs baselines)
      - name: Run E2E tests
        run: npx playwright test e2e/critical-flows.spec.ts --project=chromium

      # Upload test artifacts on failure
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            e2e/test-results/
            e2e/html-report/
          retention-days: 7

      # Run visual regression (allow failure until baselines are committed)
      - name: Run visual regression tests
        continue-on-error: true
        run: npx playwright test e2e/visual-regression.spec.ts --project=chromium

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: e2e/visual-diffs/
          retention-days: 7
