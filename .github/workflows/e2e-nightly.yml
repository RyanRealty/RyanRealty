name: Nightly E2E — Full Crawl + All Features

on:
  # Run every night at 09:00 UTC (2:00 AM Pacific / 1:00 AM PDT)
  schedule:
    - cron: '0 9 * * *'

  # Allow manual trigger for ad-hoc full sweeps
  workflow_dispatch:
    inputs:
      site_url:
        description: "Site URL to test (defaults to https://ryan-realty.com)"
        required: false
        default: ""
      crawl_limit:
        description: "Cap CRAWL_LIMIT for the full crawl (0 = all routes)"
        required: false
        default: "0"

# Failure-issue step needs issues:write — without it create-issue 403s
# (runs 32016873938 / 32122527433: "Resource not accessible by integration").
permissions:
  contents: read
  issues: write

jobs:
  e2e-nightly:
    runs-on: ubuntu-latest
    # Full inventory is ~289 routes × 2 tests + admin axe (~729 tests listed).
    # 30 minutes could not finish a real crawl; 180 covers features + crawl +
    # CI retries=2 against production.
    timeout-minutes: 180

    env:
      SITE_URL: ${{ github.event.inputs.site_url || vars.SITE_URL || 'https://ryan-realty.com' }}
      # 0 means no cap — all routes in ROUTE_INVENTORY.md
      CRAWL_LIMIT: ${{ github.event.inputs.crawl_limit || '0' }}
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run feature specs against production
        env:
          BASE_URL: ${{ env.SITE_URL }}
        # Directory arg (exists on disk) — Playwright runs that folder.
        # Do not pass --reporter=github: that drops the HTML reporter from
        # playwright.config.ts, which is why artifact uploads were empty.
        run: npx playwright test features --project=chromium
        continue-on-error: true
        id: e2e_features

      - name: Run full page crawl against production
        env:
          BASE_URL: ${{ env.SITE_URL }}
          CRAWL_LIMIT: ${{ env.CRAWL_LIMIT }}
        # testDir is ./e2e. `e2e/full-crawl.spec.ts` is a regex against
        # testDir-relative paths, so it never matched `full-crawl.spec.ts`
        # (runs 32016873938 / 32122527433: "No tests found").
        run: npx playwright test full-crawl --project=chromium
        continue-on-error: true
        id: e2e_crawl

      - name: Upload artifacts on any failure
        if: steps.e2e_features.outcome == 'failure' || steps.e2e_crawl.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-artifacts-${{ github.run_id }}
          path: |
            e2e/test-results/
            e2e/html-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Create or update issue on failure
        if: steps.e2e_features.outcome == 'failure' || steps.e2e_crawl.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly E2E failure (${new Date().toISOString().slice(0, 10)})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const featureResult = '${{ steps.e2e_features.outcome }}';
            const crawlResult = '${{ steps.e2e_crawl.outcome }}';

            const body = [
              `## Nightly E2E tests failed`,
              ``,
              `**URL tested:** ${process.env.SITE_URL}`,
              `**Feature specs:** ${featureResult}`,
              `**Full crawl:** ${crawlResult}`,
              `**Run:** [${runUrl}](${runUrl})`,
              `**Date:** ${new Date().toISOString()}`,
              ``,
              `Artifacts (screenshots + traces) are attached to the workflow run for 14 days.`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-e2e-failure',
              per_page: 5,
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Nightly E2E failed again — [run ${context.runId}](${runUrl}) — ${new Date().toISOString()}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['nightly-e2e-failure', 'bug'],
              });
            }

      - name: Fail job if any test step failed
        if: steps.e2e_features.outcome == 'failure' || steps.e2e_crawl.outcome == 'failure'
        run: |
          echo "::error::Nightly E2E failed. Feature specs: ${{ steps.e2e_features.outcome }}, Full crawl: ${{ steps.e2e_crawl.outcome }}"
          exit 1
