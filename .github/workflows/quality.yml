name: "Quality checks (nightly)"

on:
  schedule:
    # Run every night at 3:00 AM UTC
    - cron: "0 3 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SKYSLOPE_ACCESS_KEY: ${{ secrets.SKYSLOPE_ACCESS_KEY }}
      SKYSLOPE_ACCESS_SECRET: ${{ secrets.SKYSLOPE_ACCESS_SECRET }}
      SKYSLOPE_CLIENT_ID: ${{ secrets.SKYSLOPE_CLIENT_ID }}
      SKYSLOPE_CLIENT_SECRET: ${{ secrets.SKYSLOPE_CLIENT_SECRET }}
      # Full-access Resend key for the webhook-registration check (the account
      # RESEND_API_KEY is send-only). Until this secret is set, ci:resend-webhook
      # SKIPS (exit 0) — the step is safe to run before the key is provisioned.
      RESEND_WEBHOOKS_API_KEY: ${{ secrets.RESEND_WEBHOOKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Lighthouse CI
      - name: Lighthouse CI
        run: npm run ci:lighthouse

      # Accessibility (pa11y)
      - name: Accessibility (pa11y)
        run: npm run ci:a11y

      # Resend webhook registration (W9.5) — off-chain nightly. Verifies a
      # webhook targeting the ingest route is registered so bounce suppression
      # can't silently die. SKIPS cleanly until RESEND_WEBHOOKS_API_KEY is set.
      - name: Resend webhook registered (ci:resend-webhook)
        run: npm run ci:resend-webhook
