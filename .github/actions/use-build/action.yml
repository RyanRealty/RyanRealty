name: Use the PR's production build
description: >
  Installs dependencies, waits for the .next build the `build` job makes for
  this commit, unpacks it, and (optionally) starts `next start` on
  127.0.0.1:3000. Every runtime gate job uses this so the app is compiled ONCE
  per run instead of once per job (the old e2e job rebuilt it, 7.5 minutes).
inputs:
  start-server:
    description: Start the production server on 127.0.0.1:3000 and wait for it.
    default: 'true'
  playwright:
    description: Install Playwright's chromium (route smoke, tap targets, content floor, e2e).
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - shell: bash
      run: npm ci
    - name: Install Playwright browsers
      if: inputs.playwright == 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
    # The runtime jobs start AFTER the build (needs: [changes, build]). They
    # used to start alongside it and poll here, which held a runner per job
    # while the build itself sat queued for one: on 2026-10-14 the build
    # waited over an hour and every poller hit its 15-minute job timeout,
    # cancelling smoke, a11y, lighthouse and content-floor on every PR. The
    # wait below stays as a guard: the artifact is normally already there.
    - name: Wait for the build
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        for i in $(seq 1 150); do
          body=$(gh api "$RUN/artifacts" 2>/dev/null || true)
          if printf '%s' "$body" | node scripts/lib/valid-json.mjs --stdin; then
            if [ -n "$(printf '%s' "$body" | jq -r '.artifacts[] | select(.name == "next-build") | .id' | head -1)" ]; then
              echo "next-build artifact found (waited ~$((i * 10 - 10))s)"; exit 0
            fi
          fi
          jobs=$(gh api "$RUN/jobs?per_page=100" 2>/dev/null || true)
          if printf '%s' "$jobs" | node scripts/lib/valid-json.mjs --stdin; then
            state=$(printf '%s' "$jobs" | jq -r '.jobs[] | select(.name == "build") | "\(.status) \(.conclusion)"')
            case "$state" in
              "completed success") ;;  # uploaded; the artifact list catches up on the next probe
              completed*) echo "::error::the build job ended ($state) without an artifact"; exit 1 ;;
            esac
          fi
          sleep 10
        done
        echo "::error::no next-build artifact after 25 minutes"; exit 1
    # download-artifact parses the artifacts list as JSON. An empty or
    # truncated reply is "unexpected end of JSON input". Retry until valid.
    - name: Wait for a valid artifacts JSON reply
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        for i in $(seq 1 12); do
          body=$(gh api "$RUN/artifacts" 2>/dev/null || true)
          if printf '%s' "$body" | node scripts/lib/valid-json.mjs --stdin; then
            echo "artifacts list is valid JSON (try $i)"; exit 0
          fi
          echo "artifacts list not valid JSON (try $i); retrying"
          sleep 5
        done
        echo "::error::artifacts list was not valid JSON after 12 tries"; exit 1
    - uses: actions/download-artifact@v4
      with:
        name: next-build
    - name: Unpack build
      shell: bash
      run: |
        tar -I zstd -xf next-build.tar.zst
        rm next-build.tar.zst
        test -f .next/BUILD_ID || { echo "next-build artifact has no .next/BUILD_ID"; exit 1; }
    # Same start / wait as the old single-job route smoke step: the wait
    # reports what it saw on every probe and the server log is dumped on
    # failure. No teardown on purpose: killing the process group took the
    # runner down once; the runner reaps next-server itself.
    - name: Start production server
      if: inputs.start-server == 'true'
      shell: bash
      run: |
        npm run start:ci > /tmp/next-server.log 2>&1 &
        if ! node scripts/wait-for-server.mjs http://127.0.0.1:3000 180; then
          echo "----- server log -----"
          cat /tmp/next-server.log || true
          exit 1
        fi
